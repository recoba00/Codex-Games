name: Soul Link Checks

on:
  push:
    paths:
      - 'soullink/**'
      - '.github/workflows/soullink-checks.yml'
  pull_request:
    paths:
      - 'soullink/**'
      - '.github/workflows/soullink-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: soullink-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-contracts:
    name: Portable Node Contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: soullink
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check Host, Audio, Intro, Catalog, and Infrastructure Contracts
        run: node --test tests/host.test.cjs tests/audio.test.cjs tests/intro.test.cjs tests/catalog-seed.test.cjs tests/infra.test.cjs
      - name: Check Authoritative Match Server
        run: node --test server/test/*.test.mjs
