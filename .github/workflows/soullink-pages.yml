name: Deploy Soul Link Web

on:
  push:
    branches: [main]
    paths:
      - 'soullink/**'
      - '.github/workflows/soullink-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Export Godot Web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Restore Godot cache
        id: godot-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.godot-install-dir/4.7.2-stable
            ~/.local/share/godot/export_templates/4.7.2.stable
          key: godot-4.7.2-stable-web-v1

      - name: Setup Godot 4.7.2
        if: steps.godot-cache.outputs.cache-hit != 'true'
        uses: solarlabyrinth/action-setup-godot@d9f6c080367bc8e35dd623433be29e9f59f53a87 # v3
        with:
          version: 4.7.2-stable
          export-templates: true

      - name: Add cached Godot to PATH
        if: steps.godot-cache.outputs.cache-hit == 'true'
        shell: bash
        run: echo "$HOME/.godot-install-dir/4.7.2-stable" >> "$GITHUB_PATH"

      - name: Export Soul Link
        shell: bash
        run: |
          mkdir -p soullink/build/web _site/soullink
          godot --headless --path soullink --export-release Web "$GITHUB_WORKSPACE/soullink/build/web/index.html"
          cp soullink/web/host-bridge.js soullink/build/web/host-bridge.js
          node soullink/tools/audio-runtime.cjs
          node soullink/tools/intro-runtime.cjs
          cp -R soullink/build/web/. _site/soullink/
          cp soullink/pages/index.html _site/index.html
          test -s _site/soullink/index.html
          test -s _site/soullink/index.pck
          test -s _site/soullink/index.wasm

      - name: Check release size and contents
        run: node soullink/tools/size-report.cjs _site/soullink

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site

  deploy:
    name: Publish GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
