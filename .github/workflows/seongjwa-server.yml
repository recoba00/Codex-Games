name: Seongjwa Server

# 성좌 결투 서버: 푸시마다 테스트, 배포는 Actions 화면에서 수동 실행(Run workflow)으로만.
# 필요한 저장소 설정(Settings → Secrets and variables → Actions):
#   Secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, SEONGJWA_SUPABASE_SERVICE_KEY, SEONGJWA_TOKEN_SECRET
#   Supabase 주소는 seongjwa/server/wrangler.jsonc 의 vars.SUPABASE_URL
on:
  push:
    paths:
      - 'seongjwa/server/**'
      - 'seongjwa/supabase/**'
      - '.github/workflows/seongjwa-server.yml'
  pull_request:
    paths:
      - 'seongjwa/server/**'
      - 'seongjwa/supabase/**'
      - '.github/workflows/seongjwa-server.yml'
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Cloudflare에 배포'
        type: boolean
        default: true
      dev_login:
        description: '개발 로그인·테스트 화면(/dev) 켜기 (출시 전 테스트 환경만)'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: seongjwa-server-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Server Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:  # 경제 통합 테스트용 실제 DB(마이그레이션 적용)
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    defaults:
      run:
        working-directory: seongjwa/server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - name: Unit tests (engine, API)
        run: npm test
      - name: Live test on local Workers runtime (friend room)
        run: npm run test:live
      - name: Live test on local Workers runtime (ranked queue, AI, practice)
        run: npm run test:live:rank
      - name: Apply DB migrations to test Postgres + DB function checks (step5, step6)
        run: bash ../supabase/tests/rebuild_local.sh
      - name: Live test on local Workers runtime + Postgres (economy, missions, mail, shop, payments)
        run: npm run test:live:econ
      - name: Live test on local Workers runtime + Postgres (backoffice, sanctions, reports, cron)
        run: npm run test:live:bo
      - name: Live test on local Workers runtime + Postgres (friends, invites, emotes, pair-avoid, rank road, season payout cron)
        run: npm run test:live:social
      - name: Live test on local Workers runtime + Postgres (metrics events, banned words, account link/delete, purge cron)
        run: npm run test:live:ops
      - name: Live test on local Workers runtime + Postgres + browser (asset upload, regions, storage stub)
        run: |
          npm i --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
          npm run test:live:assets

  deploy:
    name: Deploy to Cloudflare
    needs: test
    if: github.event_name == 'workflow_dispatch' && inputs.deploy && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: seongjwa/server
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - name: Check settings
        env:
          KEY: ${{ secrets.SEONGJWA_SUPABASE_SERVICE_KEY }}
          TOK: ${{ secrets.SEONGJWA_TOKEN_SECRET }}
        run: |
          missing=""
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ -n "$KEY" ] || missing="$missing SEONGJWA_SUPABASE_SERVICE_KEY"
          [ "${#TOK}" -ge 32 ] || missing="$missing SEONGJWA_TOKEN_SECRET(32자 이상)"
          if [ -n "$missing" ]; then echo "::error::저장소 설정이 없습니다:$missing"; exit 1; fi
      - name: Deploy worker
        env:
          DEV: ${{ inputs.dev_login && '1' || '0' }}
        run: npx wrangler deploy --var "DEV_LOGIN:$DEV"
      - name: Set worker secrets
        env:
          KEY: ${{ secrets.SEONGJWA_SUPABASE_SERVICE_KEY }}
          TOK: ${{ secrets.SEONGJWA_TOKEN_SECRET }}
        run: |
          umask 077
          node -e 'require("fs").writeFileSync(process.env.RUNNER_TEMP + "/s.json", JSON.stringify({ SUPABASE_SERVICE_KEY: process.env.KEY, TOKEN_SECRET: process.env.TOK }))'
          npx wrangler secret bulk "$RUNNER_TEMP/s.json"
          rm -f "$RUNNER_TEMP/s.json"
      - name: Smoke test (asset storage bucket, service key)
        env:
          KEY: ${{ secrets.SEONGJWA_SUPABASE_SERVICE_KEY }}
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const url = readFileSync("wrangler.jsonc", "utf8").match(/"SUPABASE_URL"\s*:\s*"([^"]+)"/)[1].replace(/\/$/, "");
            const key = process.env.KEY, h = { apikey: key, ...(key.startsWith("eyJ") ? { authorization: "Bearer " + key } : {}) };
            const body = readFileSync("test/fixtures/assets/face.webp");
            const put = await fetch(url + "/storage/v1/object/assets/smoke/ci-check.webp", { method: "POST", headers: { ...h, "content-type": "image/webp", "x-upsert": "true" }, body });
            if (!put.ok) { console.log("::error::storage upload " + put.status + " " + (await put.text()).slice(0, 200)); process.exit(1); }
            const get = await fetch(url + "/storage/v1/object/public/assets/smoke/ci-check.webp");
            console.log({ upload: put.status, publicGet: get.status, cors: get.headers.get("access-control-allow-origin"), bytes: (await get.arrayBuffer()).byteLength });
            if (!get.ok) process.exit(1);
            await fetch(url + "/storage/v1/object/assets/smoke/ci-check.webp", { method: "DELETE", headers: h });
          '
      - name: Smoke test (deployed worker)
        env:
          BASE: https://seongjwa.recoba00.workers.dev
          DEV: ${{ inputs.dev_login && '1' || '0' }}
        run: |
          set -e
          sleep 5
          echo "health:";  curl -fsS "$BASE/health"; echo
          echo "data:";    curl -fsS "$BASE/v1/data/live" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);const d=j.data;console.log({version:j.version,characters:Object.keys(d.characters).length,cards:Object.keys(d.cards).length,spells:Object.keys(d.spells).length,presets:Object.keys(d.presets).length})})'
          if [ "$DEV" = "1" ]; then
            tok=$(curl -fsS -X POST "$BASE/v1/auth/dev" -H 'content-type: application/json' -d '{"devId":"smoke-test"}' | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).accessToken))')
            echo "me:";   curl -fsS "$BASE/v1/me" -H "authorization: Bearer $tok"; echo
            echo "room:"; curl -fsS -X POST "$BASE/v1/rooms" -H "authorization: Bearer $tok" -H 'content-type: application/json' -d '{"options":{"bans":true,"turnSec":20}}'; echo
            echo "practice:"; curl -fsS -X POST "$BASE/v1/practice" -H "authorization: Bearer $tok" -H 'content-type: application/json' -d '{"difficulty":"easy"}'; echo
            echo "rank:"; curl -fsS "$BASE/v1/rank/me" -H "authorization: Bearer $tok"; echo
            echo "queue ticket:"; curl -fsS -X POST "$BASE/v1/queue/ticket" -H "authorization: Bearer $tok" -H 'content-type: application/json' -d '{}' | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);if(!j.ticket)process.exit(1);console.log({tier:j.tierName,rp:j.rp,aiFallback:j.aiFallback})})'
            echo "board:"; curl -fsS "$BASE/v1/rank/board" | head -c 300; echo
            echo "econ:"; curl -fsS "$BASE/v1/econ" -H "authorization: Bearer $tok" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);if(!j.ok)process.exit(1);console.log({gold:j.gold,daily:j.daily.length,weekly:j.weekly.length,season:j.season.length,mail:j.mailUnread})})'
            echo "shop:"; curl -fsS "$BASE/v1/shop" -H "authorization: Bearer $tok" | head -c 300; echo
            echo "inventory:"; curl -fsS "$BASE/v1/inventory" -H "authorization: Bearer $tok" | head -c 300; echo
            echo "lobby:"; curl -fsS "$BASE/v1/lobby" | head -c 300; echo
            echo "friends:"; curl -fsS "$BASE/v1/friends" -H "authorization: Bearer $tok" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);if(!j.ok||!/^ASTRA-/.test(j.code))process.exit(1);console.log({code:j.code,friends:j.friends.length})})'
            echo "account:"; curl -fsS "$BASE/v1/account" -H "authorization: Bearer $tok" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);if(!j.ok)process.exit(1);console.log({status:j.status,logins:j.logins})})'
            echo "events:"; curl -fsS -X POST "$BASE/v1/events" -H "authorization: Bearer $tok" -H 'content-type: application/json' -d '{"platform":"steam","device":"desktop","appVer":"smoke","events":[{"name":"session_start","props":{"smoke":true}}]}'; echo
            echo "assets:"; curl -fsS "$BASE/v1/assets" | head -c 300; echo
            echo "hall of fame:"; curl -fsS "$BASE/v1/hall-of-fame" | head -c 200; echo
            echo "backoffice page:"; curl -fsS -o /dev/null -w "%{http_code}\n" "$BASE/bo"
            echo "backoffice api (no login → 401):"; test "$(curl -s -o /dev/null -w "%{http_code}" "$BASE/bo/v1/me")" = "401" && echo ok
          fi
      - name: Show deployment
        run: npx wrangler deployments list | head -20   # 배포 주소(…workers.dev)는 위 Deploy worker 단계 로그에 표시
